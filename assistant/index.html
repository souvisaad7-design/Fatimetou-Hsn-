<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>المساعد الذكي | جمعية عون وسند الخيرية</title>
  <meta name="description" content="المساعد الذكي لجمعية عون وسند الخيرية: إجابات عن الجمعية وأهدافها ومشاريعها والتطوع والدعم.">
  <meta name="theme-color" content="#0d6b62">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- الشريط الجانبي: المحادثات -->
    <aside class="sidebar" id="sidebar" aria-label="المحادثات">
      <div class="sidebar__head">
        <a class="brand" href="./" aria-label="المساعد الذكي - البداية">
          <img class="brand__logo" data-org-logo src="assets/logo.svg" alt="" width="36" height="36">
          <span class="brand__text"><b data-org-short>عون وسند</b><small>المساعد الذكي</small></span>
        </a>
        <button class="icon-btn only-mobile" id="closeSidebar" type="button" aria-label="إغلاق القائمة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChatSide" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        محادثة جديدة
      </button>

      <div class="sidebar__label">المحادثات السابقة</div>
      <ul class="history" id="history"></ul>
      <p class="history__empty" id="historyEmpty">لا توجد محادثات بعد. ابدأ بطرح سؤالك.</p>

      <div class="sidebar__foot">
        <a class="side-link" id="membershipLink" href="#" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-4A3.5 3.5 0 0 0 4 17.5V19M9.5 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 8v6M22 11h-6"/></svg>
          <span>الانتساب إلى الجمعية</span>
        </a>
        <button class="side-link" id="themeToggle" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <span id="themeLabel">الوضع الداكن</span>
        </button>
        <div class="mode-badge" id="modeBadge">نسخة تجريبية</div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- منطقة المحادثة -->
    <main class="chat">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" type="button" aria-label="فتح قائمة المحادثات" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="topbar__title">
          <img data-org-logo src="assets/logo.svg" alt="شعار جمعية عون وسند الخيرية" width="32" height="32">
          <div>
            <h1 data-org-name>جمعية عون وسند الخيرية</h1>
            <span class="status"><i aria-hidden="true"></i>المساعد الذكي متاح</span>
          </div>
        </div>
        <button class="icon-btn" id="newChatTop" type="button" aria-label="محادثة جديدة" title="محادثة جديدة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </header>

      <section class="thread" id="thread" aria-live="polite" aria-label="الرسائل">
        <!-- شاشة الترحيب (تظهر عندما تكون المحادثة فارغة) -->
        <div class="welcome" id="welcome">
          <img class="welcome__logo" data-org-logo src="assets/logo.svg" alt="" width="72" height="72">
          <h2 class="welcome__title">كيف يمكنني مساعدتك؟</h2>
          <div class="welcome__msg" id="welcomeText"></div>
          <div class="suggestions" id="suggestions" role="list"></div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <label for="input" class="visually-hidden">اكتب سؤالك</label>
          <textarea id="input" rows="1" placeholder="اكتب سؤالك عن الجمعية..." maxlength="2000" enterkeyhint="send"></textarea>
          <button class="send" id="send" type="submit" aria-label="إرسال" disabled>
            <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
        </form>
        <p class="disclaimer">المساعد يعمل حالياً بإجابات تجريبية، وقد لا تعكس المعلومات الرسمية للجمعية بشكل كامل.</p>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- ترتيب التحميل مهم: الإعدادات ← البيانات ← الخدمات ← الواجهة -->
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chat-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
